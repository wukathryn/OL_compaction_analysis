name: cmp_analysis
channels:
  - conda-forge
dependencies:
  - python=3.13

  # scientific core
  - numpy=1.26.4
  - scipy=1.15.2
  - pandas=2.2.3
  - statsmodels=0.14.4

  # image processing / I/O
  - scikit-image=0.26.0
  - tifffile=2026.2.20
  - pillow=11.1.0

  # plotting
  - matplotlib=3.10.0
  - seaborn=0.13.2

  # notebooks
  - jupyterlab=4.3.5
  - ipykernel=6.29.5
  - tqdm=4.67.1

  # build / install
  - pip
  - pip:
      # bioio ecosystem (pip-only)
      - bioio==3.2.0
      - bioio-ome-tiff==1.4.0
      - bioio-czi==2.6.0
      # statistical annotations on plots
      - starbars==3.1.1
