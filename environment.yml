name: img_analysis
channels:
  - conda-forge
dependencies:
  - python=3.10

  # scientific core
  - numpy
  - scipy
  - pandas
  - statsmodels

  # image processing / I/O
  - scikit-image
  - tifffile
  - pillow

  # plotting
  - matplotlib
  - seaborn

  # notebook
  - jupyterlab
  - ipykernel
  - ipywidgets
  - tqdm

  # build / install
  - pip
  - pip:
      # AICS / bioio ecosystem (pip-only)
      - bioio
      - bioio-ome-tiff
      - bioio-tifffile
      - bioio-imageio
      - aicsimageio        # legacy, still used in d03_exclusion_analysis
      # stats annotations on plots
      - starbars
